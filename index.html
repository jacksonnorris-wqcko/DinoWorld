<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eaf8ef">
  <meta name="description" content="Dino World is a friendly dinosaur playground for little explorers.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./apple-touch-icon.png" type="image/png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css?v=0.0.15">
  <title>Dino World</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">🦖</div>
      <div class="brand-copy"><h1><span class="brand-dino">Dino</span> <span class="brand-world">World</span></h1><p>Little explorers, big discoveries!</p></div>
      <button id="soundToggle" class="sound-button" aria-label="Toggle sound" title="Sound on">🔊</button>
    </header>

    <section class="scene-card" aria-label="Dinosaur playground">
      <div class="scene-visual" aria-label="Tap a dinosaur to say hello">
        <img class="scene-group-art" data-art="hero" src="" alt="Rex the T. rex, Stan the Triceratops and Jarvis the Brachiosaurus in Sunny Dino Meadow">
        <div class="scene-hud">
          <div class="scene-label"><span class="sun-dot"></span><span>Sunny Dino Meadow</span></div>
          <div class="speech-bubble" id="speechBubble" role="status" aria-live="polite">Tap a dinosaur to say hello!</div>
        </div>
        <div class="scene-bottom"><span id="weatherText">A lovely day to explore</span><span class="tiny-stars" aria-hidden="true">✦ ✦ ✦</span></div>
      </div>
    </section>

    <section class="dino-picker" aria-label="Choose a dinosaur">
      <button class="dino-choice selected" data-dino="rex"><img class="dino-portrait rex-portrait" data-art="rex" src="" alt=""><span>Rex</span><small>T. rex</small></button>
      <button class="dino-choice" data-dino="stan"><img class="dino-portrait stan-portrait" data-art="stan" src="" alt=""><span>Stan</span><small>Triceratops</small></button>
      <button class="dino-choice" data-dino="jarvis"><img class="dino-portrait jarvis-portrait" data-art="jarvis" src="" alt=""><span>Jarvis</span><small>Brachiosaurus</small></button>
    </section>

    <section class="activity-dock" aria-label="Let's play activities">
      <div class="dock-heading"><div><h2>Let's play!</h2><p>Choose something fun to do.</p></div><span class="dock-sparkle" aria-hidden="true">✦</span></div>
      <div class="activity-grid">
        <button class="activity-card egg-card" data-activity="egg" aria-label="Hatch an egg">
          <span class="activity-icon" aria-hidden="true"><svg viewBox="0 0 64 64" role="presentation"><ellipse cx="32" cy="54" rx="22" ry="5" fill="#e5c58d"/><path d="M13 49l6-9 7 6 6-10 8 10 8-6 7 9" fill="none" stroke="#b47b3d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 8c-9 0-17 18-17 29a17 17 0 0 0 34 0C49 26 41 8 32 8z" fill="#fffdf1" stroke="#e4d7bd" stroke-width="2"/><path d="M23 24c2-5 4-8 7-10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M15 48l-7-7m41 8l7-8" stroke="#5ebc72" stroke-width="4" stroke-linecap="round"/><path d="M13 43l-5-6m42 9l7-7" stroke="#83d48a" stroke-width="3" stroke-linecap="round"/></svg></span><span class="activity-copy"><strong>Hatch an egg</strong><small>Who's inside?</small></span>
        </button>
        <button class="activity-card feed-card" data-activity="feed" aria-label="Feed a dinosaur">
          <span class="activity-icon" aria-hidden="true"><svg viewBox="0 0 64 64" role="presentation"><path d="M12 46C8 28 19 15 32 14c14-1 24 12 20 31-2 8-9 12-20 12S14 54 12 46z" fill="#b77c4c"/><path d="M15 43c-3-14 6-24 17-24s20 10 17 24c-2 7-8 10-17 10S17 50 15 43z" fill="#e5a56b"/><path d="M32 44C18 34 20 22 22 12c8 5 12 12 10 21 2-11 9-18 18-20 0 13-3 24-18 31z" fill="#45a956" stroke="#287b40" stroke-width="1.5"/><path d="M31 43l5-24M31 36l-8-9m10 4l9-9" fill="none" stroke="#b6e47d" stroke-width="2" stroke-linecap="round"/><circle cx="23" cy="47" r="3" fill="#d94243"/><circle cx="42" cy="48" r="3" fill="#d94243"/></svg></span><span class="activity-copy"><strong>Feed a dino</strong><small>Yum, yum!</small></span>
        </button>
        <button class="activity-card learn-card" data-activity="learn" aria-label="Dinosaur quiz">
          <span class="activity-icon" aria-hidden="true"><svg viewBox="0 0 64 64" role="presentation"><path d="M7 15c9-4 17-2 25 4 8-6 16-8 25-4v36c-9-4-17-2-25 4-8-6-16-8-25-4z" fill="#fff9e8" stroke="#bd8a58" stroke-width="2.5" stroke-linejoin="round"/><path d="M32 19v35" stroke="#bd8a58" stroke-width="2"/><path d="M13 23l13 2m-13 5l12 2m-12 5l11 2m16-14l12-2m-12 7l12-2m-12 7l11-2" stroke="#d9c5a2" stroke-width="2" stroke-linecap="round"/><path d="M40 13c-2-7 5-10 10-6 3 2 2 7-1 10-2 2-5 2-5 5" fill="#6fba62" stroke="#39834b" stroke-width="2" stroke-linecap="round"/><circle cx="44" cy="28" r="1.8" fill="#39834b"/></svg></span><span class="activity-copy"><strong>Dino quiz</strong><small>Let's discover</small></span>
        </button>
        <button class="activity-card dance-card" data-activity="dance" aria-label="Dance time">
          <span class="activity-icon" aria-hidden="true"><svg viewBox="0 0 64 64" role="presentation"><path d="M39 10v34a9 9 0 1 1-5-8V18l22-5v27a9 9 0 1 1-5-8V7z" fill="#a855d6" stroke="#6f35a6" stroke-width="2.5" stroke-linejoin="round"/><path d="M10 19l3 6 6 2-6 3-3 6-3-6-6-3 6-2z" fill="#f5c84c"/><path d="M20 7l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" fill="#f5c84c"/><path d="M53 47l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" fill="#ef7b9d"/></svg></span><span class="activity-copy"><strong>Dance time</strong><small>Wiggle along!</small></span>
        </button>
      </div>
    </section>

    <footer class="app-footer"><span>🧡 Made for little dino fans</span><button id="parentButton" class="parent-link">Grown-ups</button><span class="version" id="versionLabel">v0.0.15</span></footer>
  </main>

  <div class="modal-backdrop hidden" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card"><button class="modal-close" id="modalClose" aria-label="Close">✕</button><div class="modal-art" id="modalArt">🥚</div><h2 id="modalTitle">Surprise!</h2><p id="modalText">Let's see what's inside.</p><div id="modalChoices" class="modal-choices"></div><button id="modalAction" class="primary-button">Let's go!</button></div>
  </div>
  <div id="updateToast" class="update-toast hidden" role="status">A new Dino World update is ready…</div>
  <script src="./artwork.js?v=0.0.14" defer></script><script src="./app.js?v=0.0.15" defer></script>
</body>
</html>
