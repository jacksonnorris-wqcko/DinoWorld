<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eaf8ef">
  <meta name="description" content="Dino World is a friendly dinosaur playground for little explorers.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./apple-touch-icon.png" type="image/png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css?v=0.0.14">
  <title>Dino World</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">🦖</div>
      <div class="brand-copy"><h1><span class="brand-dino">Dino</span> <span class="brand-world">World</span></h1><p>Little explorers, big discoveries!</p></div>
      <button id="soundToggle" class="sound-button" aria-label="Toggle sound" title="Sound on">🔊</button>
    </header>

    <section class="scene-card" aria-label="Dinosaur playground">
      <div class="scene-visual" aria-label="Tap a dinosaur to say hello">
        <img class="scene-group-art" data-art="hero" src="" alt="Rex the T. rex, Stan the Triceratops and Jarvis the Brachiosaurus in Sunny Dino Meadow">
        <div class="scene-hud">
          <div class="scene-label"><span class="sun-dot"></span><span>Sunny Dino Meadow</span></div>
          <div class="speech-bubble" id="speechBubble" role="status" aria-live="polite">Tap a dinosaur to say hello!</div>
        </div>
        <div class="scene-bottom"><span id="weatherText">A lovely day to explore</span><span class="tiny-stars" aria-hidden="true">✦ ✦ ✦</span></div>
      </div>
    </section>

    <section class="dino-picker" aria-label="Choose a dinosaur">
      <button class="dino-choice selected" data-dino="rex"><img class="dino-portrait rex-portrait" data-art="rex" src="" alt=""><span>Rex</span><small>T. rex</small></button>
      <button class="dino-choice" data-dino="stan"><img class="dino-portrait stan-portrait" data-art="stan" src="" alt=""><span>Stan</span><small>Triceratops</small></button>
      <button class="dino-choice" data-dino="jarvis"><img class="dino-portrait jarvis-portrait" data-art="jarvis" src="" alt=""><span>Jarvis</span><small>Brachiosaurus</small></button>
    </section>

    <section class="activity-dock" aria-label="Let's play activities">
      <div class="dock-heading"><div><h2>Let's play!</h2><p>Choose something fun to do.</p></div><span class="dock-sparkle" aria-hidden="true">✦</span></div>
      <div class="activity-grid">
        <button class="activity-card egg-card" data-activity="egg" aria-label="Hatch an egg">
          <img data-art="egg" src="" alt=""><span class="activity-copy"><strong>Hatch an egg</strong><small>Who's inside?</small></span><span class="activity-arrow" aria-hidden="true">›</span>
        </button>
        <button class="activity-card feed-card" data-activity="feed" aria-label="Feed a dinosaur">
          <img data-art="feed" src="" alt=""><span class="activity-copy"><strong>Feed a dino</strong><small>Yum, yum!</small></span><span class="activity-arrow" aria-hidden="true">›</span>
        </button>
        <button class="activity-card learn-card" data-activity="learn" aria-label="Dinosaur quiz">
          <img data-art="learn" src="" alt=""><span class="activity-copy"><strong>Dino quiz</strong><small>Let's discover</small></span><span class="activity-arrow" aria-hidden="true">›</span>
        </button>
        <button class="activity-card dance-card" data-activity="dance" aria-label="Dance time">
          <img data-art="dance" src="" alt=""><span class="activity-copy"><strong>Dance time</strong><small>Wiggle along!</small></span><span class="activity-arrow" aria-hidden="true">›</span>
        </button>
      </div>
    </section>

    <footer class="app-footer"><span>🧡 Made for little dino fans</span><button id="parentButton" class="parent-link">Grown-ups</button><span class="version" id="versionLabel">v0.0.14</span></footer>
  </main>

  <div class="modal-backdrop hidden" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card"><button class="modal-close" id="modalClose" aria-label="Close">✕</button><div class="modal-art" id="modalArt">🥚</div><h2 id="modalTitle">Surprise!</h2><p id="modalText">Let's see what's inside.</p><div id="modalChoices" class="modal-choices"></div><button id="modalAction" class="primary-button">Let's go!</button></div>
  </div>
  <div id="updateToast" class="update-toast hidden" role="status">A new Dino World update is ready…</div>
  <script src="./artwork.js?v=0.0.14" defer></script><script src="./app.js?v=0.0.14" defer></script>
</body>
</html>
