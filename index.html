<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eaf8ef">
  <meta name="description" content="Dino World is a friendly dinosaur playground for little explorers.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./apple-touch-icon.png" type="image/png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css?v=0.0.21">
  <title>Dino World</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">🦖</div>
      <div class="brand-copy"><h1><span class="brand-dino">Dino</span> <span class="brand-world">World</span></h1><p>Little explorers, big discoveries!</p></div>
      <button id="soundToggle" class="sound-button" aria-label="Toggle sound" title="Sound on">🔊</button>
    </header>

    <section class="scene-card" aria-label="Dinosaur playground">
      <div class="scene-visual" aria-label="Tap a dinosaur to say hello">
        <img class="scene-background" data-art="meadow" src="" alt="" aria-hidden="true">
        <img class="scene-main-dino" id="mainDino" data-art="rex" data-dino="rex" src="" alt="Rex the T. rex" role="button" tabindex="0" aria-label="Tap Rex to say hello">
        <div class="scene-hud">
          <div class="scene-label"><span class="sun-dot"></span><span>Sunny Dino Meadow</span></div>
          <div class="speech-bubble" id="speechBubble" role="status" aria-live="polite">Tap a dinosaur to say hello!</div>
        </div>
        <div class="scene-bottom"><span id="weatherText">A lovely day to explore</span><span class="tiny-stars" aria-hidden="true">✦ ✦ ✦</span></div>
      </div>
    </section>

    <section class="dino-picker" aria-label="Choose a dinosaur">
      <button class="dino-choice selected" data-dino="rex"><img class="dino-portrait rex-portrait" data-art="rex" src="" alt=""><span>Rex</span><small>T. rex</small></button>
      <button class="dino-choice" data-dino="stan"><img class="dino-portrait stan-portrait" data-art="stan" src="" alt=""><span>Stan</span><small>Triceratops</small></button>
      <button class="dino-choice" data-dino="jarvis"><img class="dino-portrait jarvis-portrait" data-art="jarvis" src="" alt=""><span>Jarvis</span><small>Brachiosaurus</small></button>
    </section>

    <section class="activity-dock" aria-label="Let's play activities">
      <div class="dock-heading"><div><h2>Let's play!</h2><p>Choose something fun to do.</p></div><span class="dock-sparkle" aria-hidden="true">✦</span></div>
      <div class="activity-grid">
        <button class="activity-card egg-card" data-activity="egg" aria-label="Hatch an egg">
          <span class="activity-icon" aria-hidden="true"><svg viewBox="0 0 80 80"><defs><linearGradient id="eggshell" x2="1" y2="1"><stop stop-color="#fffef7"/><stop offset=".65" stop-color="#fff3d2"/><stop offset="1" stop-color="#ddc49a"/></linearGradient><linearGradient id="nest" x2="0" y2="1"><stop stop-color="#dba15a"/><stop offset="1" stop-color="#96582d"/></linearGradient><filter id="shadowegg"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#956238" flood-opacity=".25"/></filter></defs><ellipse cx="40" cy="69" rx="26" ry="4" fill="#a3c58a" opacity=".45"/><g filter="url(#shadowegg)"><path d="M13 57Q19 43 30 49Q41 42 52 49Q64 45 68 57L62 65H18Z" fill="url(#nest)"/><path d="M18 56l8-7 6 8 8-9 7 9 8-7 6 7" fill="none" stroke="#f0c47f" stroke-width="4" stroke-linecap="round"/><path d="M40 8C28 8 19 31 20 45a20 20 0 0 0 40 0C61 30 51 8 40 8Z" fill="url(#eggshell)" stroke="#d8c49c" stroke-width="1.5"/><path d="M29 26q4-10 10-12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><ellipse cx="31" cy="40" rx="3" ry="4" fill="#e5c98d" opacity=".55"/><ellipse cx="48" cy="29" rx="2.5" ry="3.5" fill="#e5c98d" opacity=".55"/><path d="M13 61l-5-8m8 4l-1-8m52 11l5-8m-8 5l1-8" stroke="#55ad5d" stroke-width="4" stroke-linecap="round"/></g></svg></span><span class="activity-copy"><strong>Hatch an egg</strong><small>Who's inside?</small></span>
        </button>
        <button class="activity-card feed-card" data-activity="feed" aria-label="Feed a dinosaur">
          <span class="activity-icon" aria-hidden="true"><svg viewBox="0 0 80 80"><defs><linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#a9ed6f"/><stop offset="1" stop-color="#238440"/></linearGradient><filter id="shadowleaf"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#34773c" flood-opacity=".25"/></filter></defs><ellipse cx="40" cy="69" rx="26" ry="4" fill="#a3c58a" opacity=".45"/><g filter="url(#shadowleaf)"><path d="M13 52Q13 42 25 44Q40 36 55 44Q68 41 68 54Q64 67 40 68Q17 66 13 52Z" fill="#b77a45"/><path d="M18 51Q6 36 19 22Q32 30 31 46Q38 28 50 20Q61 33 47 49Q62 37 67 47Q58 61 41 59Q25 59 18 51Z" fill="#3c9e4d" stroke="#28753a" stroke-width="1.5"/><path d="M24 46L19 26M32 46L49 23M43 48L63 47" stroke="#b9f18a" stroke-width="2.4" stroke-linecap="round"/><path d="M24 43Q10 30 15 17Q29 23 31 39Z" fill="url(#leaf)" stroke="#28753a" stroke-width="1.5"/><path d="M42 42Q42 23 57 13Q64 30 48 46Z" fill="url(#leaf)" stroke="#28753a" stroke-width="1.5"/><path d="M31 43Q31 22 39 12Q50 25 37 45Z" fill="#62c85b" stroke="#28753a" stroke-width="1.5"/><path d="M34 42L39 17M25 38L17 22M46 39L57 18" stroke="#d0f6a7" stroke-width="2" stroke-linecap="round"/><circle cx="32" cy="53" r="5" fill="#f54e4e" stroke="#c72c36" stroke-width="1.5"/><circle cx="45" cy="55" r="5.5" fill="#e83240" stroke="#b92731" stroke-width="1.5"/><circle cx="40" cy="46" r="4.5" fill="#ff7162" stroke="#c72c36" stroke-width="1.2"/><circle cx="30.5" cy="51.5" r="1.4" fill="#ffd5a2"/></g></svg></span><span class="activity-copy"><strong>Feed a dino</strong><small>Yum, yum!</small></span>
        </button>
        <button class="activity-card learn-card" data-activity="learn" aria-label="Dinosaur quiz">
          <span class="activity-icon" aria-hidden="true"><svg viewBox="0 0 80 80"><defs><linearGradient id="cover" x2="0" y2="1"><stop stop-color="#54d0f5"/><stop offset="1" stop-color="#147ac2"/></linearGradient><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fffef6"/><stop offset="1" stop-color="#e8d5b2"/></linearGradient><filter id="shadowbook"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#376b91" flood-opacity=".28"/></filter></defs><ellipse cx="40" cy="69" rx="29" ry="4" fill="#a3c58a" opacity=".45"/><g filter="url(#shadowbook)"><path d="M7 23Q22 17 39 27Q57 17 73 23V61Q55 56 40 66Q23 56 7 61Z" fill="url(#cover)" stroke="#145e9e" stroke-width="2"/><path d="M13 26Q26 21 38 30V59Q25 51 13 56Z" fill="url(#paper)" stroke="#c3a273" stroke-width="1.5"/><path d="M42 30Q55 21 67 26V56Q54 51 42 59Z" fill="url(#paper)" stroke="#c3a273" stroke-width="1.5"/><path d="M40 29V63" stroke="#a98758" stroke-width="2.5"/><path d="M18 34l14 3m-14 5l14 3m-14 5l14 3m16-16l13-3m-13 8l13-3m-13 8l13-3" stroke="#d7c5a2" stroke-width="1.8" stroke-linecap="round"/><path d="M49 24Q43 13 51 9Q57 5 62 11Q65 17 57 24L53 29Z" fill="#54b95e" stroke="#2d8b45" stroke-width="1.5"/><path d="M54 25L58 13" stroke="#b4ed8d" stroke-width="2" stroke-linecap="round"/></g></svg></span><span class="activity-copy"><strong>Dino quiz</strong><small>Let's discover</small></span>
        </button>
        <button class="activity-card dance-card" data-activity="dance" aria-label="Dance time">
          <span class="activity-icon" aria-hidden="true"><svg viewBox="0 0 80 80"><defs><linearGradient id="purpleNote" x2="1" y2="1"><stop stop-color="#ec8aff"/><stop offset="1" stop-color="#8532cc"/></linearGradient><linearGradient id="pinkNote" x2="1" y2="1"><stop stop-color="#ff91c7"/><stop offset="1" stop-color="#d72d7a"/></linearGradient><filter id="shadownote"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#78428a" flood-opacity=".25"/></filter></defs><g filter="url(#shadownote)"><path d="M42 14V49a9 9 0 1 1-7-9V22l25-7v28a9 9 0 1 1-7-9V10Z" fill="url(#purpleNote)" stroke="#6e2caa" stroke-width="2.2" stroke-linejoin="round"/><path d="M19 37v20a7 7 0 1 1-5-7V32l19-5v19a7 7 0 1 1-5-7V33Z" fill="url(#pinkNote)" stroke="#b82b70" stroke-width="2" stroke-linejoin="round"/><path d="M17 8l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#ffd35d" stroke="#f1b735" stroke-width="1"/><path d="M64 46l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#ffd35d"/><path d="M47 16l11-3M21 35l8-2" stroke="#ffd4ff" stroke-width="2.4" stroke-linecap="round"/></g></svg></span><span class="activity-copy"><strong>Dance time</strong><small>Wiggle along!</small></span>
        </button>
      </div>
    </section>

    <footer class="app-footer"><span>🧡 Made for little dino fans</span><button id="parentButton" class="parent-link">Grown-ups</button><span class="version" id="versionLabel">v0.0.21</span></footer>
  </main>

  <div class="modal-backdrop hidden" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card"><button class="modal-close" id="modalClose" aria-label="Close">✕</button><div class="modal-art" id="modalArt">🥚</div><h2 id="modalTitle">Surprise!</h2><p id="modalText">Let's see what's inside.</p><div id="modalChoices" class="modal-choices"></div><button id="modalAction" class="primary-button">Let's go!</button></div>
  </div>
  <div id="updateToast" class="update-toast hidden" role="status">A new Dino World update is ready…</div>
  <script src="./artwork.js?v=0.0.21" defer></script><script src="./app.js?v=0.0.21" defer></script>
</body>
</html>
